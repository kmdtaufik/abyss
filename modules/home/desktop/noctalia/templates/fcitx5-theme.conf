[Metadata]
Name=noctalia
Version=1.0
Author=Noctalia
Description=Noctalia System Theme for Fcitx5
ScaleWithDPI=True

[InputPanel]
Font="Google Sans Flex 12"
NormalColor={{colors.on_surface.default.hex}}
HighlightCandidateColor={{colors.on_primary.default.hex}}
HighlightColor={{colors.primary.default.hex}}
HighlightBackgroundColor={{colors.surface.default.hex}}
Spacing=4

[InputPanel/TextMargin]
Left=10
Right=10
Top=6
Bottom=6

[InputPanel/Background]
Color={{colors.surface.default.hex}}
BorderColor={{colors.primary.default.hex}}
BorderWidth=2

[InputPanel/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[InputPanel/Highlight]
Color={{colors.primary.default.hex}}

[InputPanel/Highlight/Margin]
Left=8
Right=8
Top=5
Bottom=5

[Menu/Background]
Color={{colors.surface_container.default.hex}}

[Menu/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/Highlight]
Color={{colors.primary.default.hex}}

[Menu/Highlight/Margin]
Left=8
Right=8
Top=5
Bottom=5

[Menu/Separator]
Color={{colors.outline.default.hex}}

[Menu/TextMargin]
Left=5
Right=5
Top=5
Bottom=5
